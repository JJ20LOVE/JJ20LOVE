# 生成「贪吃蛇贡献图」并推到本仓库的 output 分支。
#
# 为什么要自己生成而不是直接引用别人的服务：README 里的图片一旦依赖第三方
# 渲染服务，对方限流或下线，主页就是一片裂图（github-readme-stats 的公共实例
# 就已经 DEPLOYMENT_PAUSED 了）。这里产物落在自己仓库的 output 分支上，
# 由 raw.githubusercontent.com 提供，只要仓库在就不会坏。
name: Generate snake

on:
  schedule:
    # 每天 UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:      # 也可以在 Actions 页手动点一下立即生成
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # 需要写权限：产物要 push 到 output 分支
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # 深浅色两版：README 用 <picture> 按主题切换
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # push_options=--force：output 是一个只放产物的分支，不保留历史
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
